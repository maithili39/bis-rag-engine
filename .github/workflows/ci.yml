name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ --select E,F,W --ignore E501

      - name: Run tests (schema + unit, no vectorstore needed)
        run: pytest tests/ -v --tb=short -k "not retrieval"

      - name: Run API tests (mocked pipeline)
        run: pytest tests/test_api.py -v --tb=short

      - name: Build Docker image
        # dataset.pdf is gitignored so build_vectorstore.py's own PDF build step
        # is skipped in CI; chromadb/ is committed to the repo so a real
        # vectorstore is baked into the image regardless.
        run: |
          touch data/dataset.pdf
          docker build -t bis-rag-engine .

      - name: Smoke-test /health
        run: |
          docker run -d -p 8000:8000 --name bis_test bis-rag-engine
          # The vectorstore + embedding model now load synchronously during
          # FastAPI startup (chromadb/ is committed to the repo), so give the
          # container real time to come up before probing /health.
          STATUS="unreachable"
          for i in $(seq 1 60); do
            RESP=$(curl -sf http://localhost:8000/health 2>/dev/null)
            if [ -n "$RESP" ]; then
              STATUS=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unreachable")
              [ "$STATUS" = "ok" ] || [ "$STATUS" = "starting" ] && break
            fi
            sleep 3
          done
          echo "Health status: $STATUS"
          docker logs bis_test
          docker stop bis_test
          [ "$STATUS" = "ok" ] || [ "$STATUS" = "starting" ] || exit 1
